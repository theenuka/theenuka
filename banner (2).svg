<svg width="820" height="240" viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="1" y="1" width="818" height="238" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="818" height="38" rx="12" fill="#161b22"/>
  <rect x="1" y="27" width="818" height="12" fill="#161b22"/>
  <line x1="1" y1="39" x2="819" y2="39" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="410" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">theenuka@platform: ~</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <!-- line 1 -->
    <text x="28" y="76" fill="#3fb950">➜</text>
    <text x="50" y="76" fill="#58a6ff">~</text>
    <text x="70" y="76" fill="#e6edf3">whoami</text>
    <text x="28" y="104" fill="#e6edf3" font-size="21" font-weight="bold">Theenuka Bandara
      <animate attributeName="opacity" values="0;0;1" dur="0.9s" fill="freeze"/>
    </text>

    <!-- line 2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1" dur="1.6s" fill="freeze"/>
      <text x="28" y="140" fill="#3fb950">➜</text>
      <text x="50" y="140" fill="#58a6ff">~</text>
      <text x="70" y="140" fill="#e6edf3">cat role</text>
      <text x="28" y="166" fill="#8b949e" font-size="15">DevOps (Platform) Engineer Intern <tspan fill="#58a6ff">@ Sysco LABS</tspan> · AWS Certified (SAA-003)</text>
      <text x="28" y="188" fill="#8b949e" font-size="15">Computer Engineering Undergrad <tspan fill="#3fb950">@ University of Ruhuna</tspan></text>
    </g>

    <!-- prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1" dur="2.4s" fill="freeze"/>
      <text x="28" y="220" fill="#3fb950">➜</text>
      <text x="50" y="220" fill="#58a6ff">~</text>
      <rect x="72" y="207" width="10" height="17" fill="#58a6ff">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- accent line -->
  <rect x="1" y="236" width="818" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
</svg>
